<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Amazon Data Center Operations Manager STAR 英文面試跟讀與單字翻譯練習">
<title>Amazon Data Center Interview Practice</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe3ef;--accent:#ff9900;--accent-dark:#c75b00;--blue:#2563eb;--soft:#fff7e8;--shadow:0 14px 34px rgba(31,45,74,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 8% 0,#fff7e8 0,transparent 32%),var(--bg);color:var(--ink);font:16px/1.65 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1120px;margin:auto;padding:28px 18px 70px}.hero{padding:30px 32px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#182b49,#315d8f 65%,#ff9900);box-shadow:var(--shadow)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}.hero h1{margin:5px 0 8px;font-size:clamp(28px,4vw,44px);line-height:1.12}.hero p{margin:0;max-width:760px;color:#eaf2ff}.toolbar{position:sticky;top:10px;z-index:10;display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);box-shadow:0 8px 22px rgba(31,45,74,.08)}
.toolbar label{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);font-weight:700}.toolbar select,.toolbar input{accent-color:var(--accent)}.toolbar select{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff;color:var(--ink)}.toolbar button,.play{border:0;border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;font-weight:800}.toolbar button{background:#eef3fb;color:#29466e}.toolbar button:hover,.play:hover{filter:brightness(.96)}#stop{background:#fee2e2;color:#a61b1b;margin-left:auto}
.hint{margin:12px 2px 20px;color:var(--muted);font-size:14px}.question{margin:20px 0;padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:var(--shadow);scroll-margin-top:100px}.qhead{display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:15px}.qnum{flex:0 0 auto;display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--soft);color:var(--accent-dark);font-weight:900}.qtitle{margin:0;font-size:clamp(19px,2.3vw,27px);line-height:1.3}.qtitle small{display:block;margin-top:6px;color:var(--muted);font-size:14px;font-weight:500}.principles{margin:12px 0 0;padding:9px 12px;border-left:3px solid var(--accent);background:#fffaf1;color:#78511f;font-size:14px}.block{margin-top:22px}.block h3{display:flex;align-items:center;gap:9px;margin:0 0 10px;font-size:17px}.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:#e8f0ff;color:#2450a4;letter-spacing:.08em}.zh{margin:0;padding:12px 14px;border-radius:12px;background:#f8fafc;color:#334155}.english{margin-top:12px;padding:14px;border:1px solid #f5d49f;border-radius:14px;background:#fffcf5}.english-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:#8a5a12;font-size:13px;font-weight:800}.line{display:flex;gap:8px;align-items:flex-start;padding:7px 6px;border-radius:9px;transition:background .2s}.line.speaking{background:#fff0c9}.play{flex:0 0 auto;padding:4px 8px;background:#ff9900;color:#fff;font-size:14px;line-height:1.2}.words{flex:1;line-height:1.8}.word{display:inline;border:0;padding:2px 1px;border-radius:4px;background:transparent;color:inherit;cursor:pointer;font:inherit}.word:hover,.word:focus{background:#dbeafe;color:#174ea6;outline:none}.slash{color:#bd7b1e;margin:0 3px}.popup{position:fixed;z-index:30;display:none;min-width:220px;max-width:min(360px,calc(100vw - 30px));padding:13px 14px;border:1px solid #bfd2f3;border-radius:13px;background:#fff;box-shadow:0 14px 35px rgba(15,45,90,.2)}.popup.show{display:block}.popup-word{font-weight:900;color:#174ea6}.popup-translation{margin-top:3px;font-size:18px}.popup-note{margin-top:5px;color:var(--muted);font-size:12px}.popup a{color:var(--blue);font-size:12px}.footer{text-align:center;margin-top:30px;color:var(--muted);font-size:13px}.loading{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:680px){.wrap{padding:14px 10px 50px}.hero{padding:24px 20px}.toolbar{top:5px}.toolbar label{width:100%}#stop{margin-left:0}.question{padding:17px}.qhead{gap:10px}.qnum{width:36px;height:36px}.line{padding-left:0}.play{padding:4px 7px}}
@media print{.toolbar,.play,.popup,.hint{display:none!important}.wrap{max-width:none;padding:0}.hero{color:#111;background:#fff;border:1px solid #aaa;box-shadow:none}.question{break-inside:avoid;box-shadow:none}}
</style>
<style>.word.current-word{background:#ffbf47;color:#172033;box-shadow:0 0 0 2px rgba(255,191,71,.3);font-weight:850}.word.word-speaking{background:#bfdbfe;color:#174ea6}</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <div class="eyebrow">Amazon · Data Center Operations Manager</div>
    <h1>STAR 英文面試練習</h1>
    <p>逐段中英對照、英文跟讀與互動單字翻譯。按每一行左側的播放鍵練習發音，點選任何英文單字查看中文意思。</p>
  </header>
  <div class="toolbar" aria-label="播放設定">
    <label>語音 <select id="voice"><option>載入語音中…</option></select></label>
    <label>速度 <input id="rate" type="range" min="0.6" max="1.4" step="0.05" value="0.9"><span id="rateValue">0.90×</span></label>
    <button id="playAll" type="button">▶ 播放本題</button>
    <button id="playEverything" type="button">▶ 播放全部 14 題</button>
    <button id="stop" type="button">■ 停止播放</button>
  </div>
  <p class="hint">小提示：播放時，目前朗讀的單字會以黃色標示，所在段落也會同步高亮；單字翻譯優先使用常見面試詞彙，其他單字會即時查詢。</p>
  <section id="content" aria-live="polite"><div class="loading">正在載入練習內容…</div></section>
  <footer class="footer">建議語速：每分鐘約 100–120 字　·　/ 代表短停頓　·　點擊單字即可翻譯</footer>
</main>
<div id="popup" class="popup" role="status" aria-live="polite"><div class="popup-word"></div><div class="popup-translation">查詢中…</div><div class="popup-note"></div></div>
<script>
const CONTENT_URL='amazon-data-center-interview-star.md';
const glossary={
  ownership:'承擔責任／主人翁精神',bias:'偏向行動；行動傾向',action:'行動',deliver:'交付／達成',results:'成果',incident:'事件（通常指服務事故）',availability:'可用性',restore:'恢復',service:'服務',controlled:'受控的',risk:'風險',records:'紀錄',decision:'決策',root:'根本的',cause:'原因',analysis:'分析',process:'流程',improvement:'改善',monitoring:'監控',logs:'日誌',traffic:'流量',change:'變更',rollback:'回復／回滾',plan:'計畫',affected:'受影響的',impact:'影響',coordinate:'協調',team:'團隊',vendor:'供應商',network:'網路',application:'應用程式',system:'系統',database:'資料庫',connection:'連線',pool:'池（資源池）',timeout:'逾時',setting:'設定',query:'查詢',release:'釋放／發布',alert:'警示',failure:'失敗',rate:'比率',peak:'尖峰',environment:'環境',engineer:'工程師',management:'管理層',priority:'優先事項',safely:'安全地',normally:'正常地',serious:'嚴重的',internal:'內部的',user:'使用者',resource:'資源',capacity:'容量',operational:'營運的',reproduce:'重現',test:'測試',update:'更新',restore:'恢復',lead:'帶領',complete:'完成',decrease:'下降',increase:'增加',response:'回應',manager:'經理',ownership:'承擔責任'
};
let questions=[], currentQuestion=null, currentUtterance=null, voices=[], wordAudio=null;
const $=s=>document.querySelector(s); const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function clean(s){return s.replace(/\*\*/g,'').replace(/`/g,'').trim()}
function parse(md){const lines=md.split(/\r?\n/);let q=null,block=null,en=false,buf=[];const flush=()=>{if(block&&buf.length){block.zh=buf.join(' ').trim();buf=[]}};for(const raw of lines){const line=raw.trim();if(!line)continue;if(/^# \d+\./.test(line)){flush();q={title:clean(line.replace(/^# /,'')),subtitle:'',principles:'',blocks:[]};questions.push(q);block=null;en=false;continue}if(!q)continue;if(/^### /.test(line)&&!q.subtitle){q.subtitle=clean(line.replace(/^### /,''));continue}if(/^\*\*(Leadership Principles|Primary|Secondary)/.test(line)){q.principles+=(q.principles?' · ':'')+clean(line);continue}if(/^## /.test(line)){flush();const rawSection=clean(line.replace(/^## /,''));const m=rawSection.match(/^([A-Z](?:\s*\/\s*[A-Z])?)\s*(?:[—-]\s*)?(.*)$/);block={letter:m?m[1]:'',title:m?clean(m[2]||m[1]):rawSection,zh:'',english:[]};q.blocks.push(block);en=false;continue}if(/^\*\*English/.test(line)){flush();en=true;continue}if(line==='---'){flush();en=false;continue}if(/^\*\*(中文|English|Primary|Secondary)/.test(line)||/^>/.test(line))continue;if(en){block?.english.push(clean(line));}else if(block){buf.push(clean(line));}}flush();return questions}
function tokenized(text){return text.split(/([A-Za-z][A-Za-z'-]*|[^A-Za-z]+)/).filter(Boolean).map(part=>{if(/^[A-Za-z]/.test(part)){const key=part.toLowerCase();return `<button class="word" data-word="${esc(part)}" type="button">${esc(part)}</button>`}return part==='/'?'<span class="slash">/</span>':esc(part)}).join('')}
function render(){const root=$('#content');root.innerHTML=questions.map((q,qi)=>`<article class="question" id="q${qi+1}"><div class="qhead"><div class="qnum">Q${qi+1}</div><h2 class="qtitle">${esc(q.title.replace(/^\d+\.\s*/,''))}<small>${esc(q.subtitle)}</small></h2></div>${q.principles?`<div class="principles">${esc(q.principles)}</div>`:''}${q.blocks.map((b,bi)=>`<section class="block"><h3><span class="badge">${b.letter}</span>${esc(b.title)}</h3>${b.zh?`<p class="zh">${esc(b.zh)}</p>`:''}${b.english.length?`<div class="english"><div class="english-label"><span>English · 跟讀版</span><span>${b.english.length} 段</span></div>${b.english.map((line,li)=>`<div class="line" data-q="${qi}" data-line="${qi}-${bi}-${li}"><button class="play" type="button" aria-label="播放這一行">▶</button><div class="words">${tokenized(line)}</div></div>`).join('')}</div>`:''}</section>`).join('')}</article>`).join('')}
function setup(){document.querySelectorAll('.play').forEach(btn=>btn.addEventListener('click',()=>speak(btn.closest('.line'))));document.querySelectorAll('.word').forEach(w=>w.addEventListener('click',()=>{speakWord(w);translate(w)}));}
function stopWordAudio(){if(wordAudio){wordAudio.pause();wordAudio.currentTime=0;wordAudio=null}document.querySelectorAll('.word-speaking').forEach(x=>x.classList.remove('word-speaking'))}
function speakWord(el){const word=el.dataset.word||el.textContent.trim();if('speechSynthesis'in window&&typeof SpeechSynthesisUtterance==='function')speechSynthesis.cancel();stopWordAudio();el.classList.add('word-speaking');if('speechSynthesis'in window&&typeof SpeechSynthesisUtterance==='function'){const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=parseFloat($('#rate').value);const selected=voices.find(v=>v.name===$('#voice').value);if(selected)u.voice=selected;u.onend=()=>el.classList.remove('word-speaking');u.onerror=()=>el.classList.remove('word-speaking');speechSynthesis.speak(u);return}const audio=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en-US&q='+encodeURIComponent(word));audio.playbackRate=parseFloat($('#rate').value);wordAudio=audio;audio.onended=()=>{if(wordAudio===audio)wordAudio=null;el.classList.remove('word-speaking')};audio.onerror=()=>{if(wordAudio===audio)wordAudio=null;el.classList.remove('word-speaking')};audio.play().catch(()=>{if(wordAudio===audio)wordAudio=null;el.classList.remove('word-speaking')})}
function clearWordMarks(){document.querySelectorAll('.current-word').forEach(x=>x.classList.remove('current-word'))}
function markCurrentWord(line,offsets,charIndex){if(!offsets.length)return;let active=offsets.find(x=>charIndex>=x.start&&charIndex<x.end);if(!active){const previous=offsets.filter(x=>x.start<=charIndex);active=previous[previous.length-1]||offsets[0]}line.querySelectorAll('.current-word').forEach(x=>x.classList.remove('current-word'));active.el.classList.add('current-word')}
function wordOffsets(line,text){const words=[...line.querySelectorAll('.word')],offsets=[];const re=/[A-Za-z][A-Za-z'-]*/g;let match,index=0;while((match=re.exec(text))&&index<words.length){offsets.push({el:words[index++],start:match.index,end:match.index+match[0].length})}return offsets}
function speak(line){if(!('speechSynthesis'in window))return alert('此瀏覽器不支援語音播放，請改用最新版 Chrome、Edge 或 Safari。');speechSynthesis.cancel();document.querySelectorAll('.line.speaking').forEach(x=>x.classList.remove('speaking'));clearWordMarks();const text=line.querySelector('.words').innerText.replace(/\s*\/\s*/g,', ');const offsets=wordOffsets(line,text);const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=parseFloat($('#rate').value);const selected=voices.find(v=>v.name===$('#voice').value);if(selected)u.voice=selected;line.classList.add('speaking');markCurrentWord(line,offsets,0);u.onboundary=e=>{if(typeof e.charIndex==='number')markCurrentWord(line,offsets,e.charIndex)};u.onend=()=>{line.classList.remove('speaking');clearWordMarks()};u.onerror=()=>{line.classList.remove('speaking');clearWordMarks()};currentUtterance=u;speechSynthesis.speak(u)}
function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang));const select=$('#voice');select.innerHTML=voices.length?voices.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} (${v.lang})</option>`).join(''):'<option value="">瀏覽器預設英文語音</option>'}if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
async function translate(el){const word=el.dataset.word, popup=$('#popup');popup.querySelector('.popup-word').textContent=word;popup.querySelector('.popup-translation').textContent=glossary[word.toLowerCase()]||'查詢中…';popup.querySelector('.popup-note').textContent='';popup.classList.add('show');const r=el.getBoundingClientRect();let left=Math.min(Math.max(12,r.left),window.innerWidth-240);let top=r.bottom+8;if(top+130>window.innerHeight)top=Math.max(12,r.top-130);popup.style.left=left+'px';popup.style.top=top+'px';if(glossary[word.toLowerCase()]){popup.querySelector('.popup-note').innerHTML='<a target="_blank" rel="noopener" href="https://translate.google.com/?sl=en&tl=zh-TW&text='+encodeURIComponent(word)+'">開啟 Google 翻譯 ↗</a>';return}try{const res=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(word)+'&langpair=en|zh-TW');const data=await res.json();const t=data?.responseData?.translatedText;if(t)popup.querySelector('.popup-translation').textContent=t;popup.querySelector('.popup-note').innerHTML='<a target="_blank" rel="noopener" href="https://translate.google.com/?sl=en&tl=zh-TW&text='+encodeURIComponent(word)+'">開啟 Google 翻譯 ↗</a>'}catch(e){popup.querySelector('.popup-translation').textContent='暫時無法查詢';popup.querySelector('.popup-note').textContent='請稍後再試，或使用 Google 翻譯連結'} }
document.addEventListener('click',e=>{if(!e.target.closest('.popup,.word'))$('#popup').classList.remove('show')});$('#rate').addEventListener('input',e=>$('#rateValue').textContent=Number(e.target.value).toFixed(2)+'×');
function playSequence(lines){if(!('speechSynthesis'in window))return alert('此瀏覽器不支援語音播放，請改用最新版 Chrome、Edge 或 Safari。');speechSynthesis.cancel();document.querySelectorAll('.line.speaking').forEach(x=>x.classList.remove('speaking'));clearWordMarks();let i=0;const next=()=>{if(i>=lines.length)return;const line=lines[i++],text=line.querySelector('.words').innerText.replace(/\s*\/\s*/g,', '),offsets=wordOffsets(line,text),u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=parseFloat($('#rate').value);const selected=voices.find(v=>v.name===$('#voice').value);if(selected)u.voice=selected;line.classList.add('speaking');line.scrollIntoView({behavior:'smooth',block:'center'});markCurrentWord(line,offsets,0);u.onboundary=e=>{if(typeof e.charIndex==='number')markCurrentWord(line,offsets,e.charIndex)};u.onend=()=>{line.classList.remove('speaking');clearWordMarks();next()};u.onerror=()=>{line.classList.remove('speaking');clearWordMarks();next()};speechSynthesis.speak(u)};next()}
$('#stop').addEventListener('click',()=>{if('speechSynthesis'in window)speechSynthesis.cancel();stopWordAudio();document.querySelectorAll('.line.speaking').forEach(x=>x.classList.remove('speaking'));clearWordMarks()});$('#playAll').addEventListener('click',()=>{const q=currentQuestion??0;playSequence([...document.querySelectorAll(`#q${q+1} .line`)] )});$('#playEverything').addEventListener('click',()=>playSequence([...document.querySelectorAll('.line')]));
fetch(CONTENT_URL).then(r=>{if(!r.ok)throw Error('load');return r.text()}).then(md=>{questions=parse(md);render();setup();const observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const n=Number(e.target.id.slice(1));currentQuestion=n-1}}),{threshold:.2});document.querySelectorAll('.question').forEach(q=>observer.observe(q))}).catch(()=>{$('#content').innerHTML='<p class="loading">無法載入內容。若直接在電腦開啟檔案，請用 GitHub Pages 或本機伺服器瀏覽，以允許載入 Markdown 檔案。</p>'});
</script>
</body>
</html>
