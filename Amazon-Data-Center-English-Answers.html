<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Amazon Data Center Operations Manager complete English interview answers">
<title>Amazon DCOM · English Answers</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe3ef;--accent:#2563eb;--accent2:#ff9900;--soft:#eef4ff;--shadow:0 12px 30px rgba(31,45,74,.08)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#fff4db 0,transparent 35%),var(--bg);color:var(--ink);font:16px/1.7 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:1080px;margin:auto;padding:26px 18px 70px}.hero{padding:28px 30px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#172b4d,#2864a8);box-shadow:var(--shadow)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.82}.hero h1{margin:5px 0 8px;font-size:clamp(28px,4vw,44px);line-height:1.1}.hero p{margin:0;color:#e7efff}.toolbar{position:sticky;top:10px;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:17px 0;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);box-shadow:0 7px 20px rgba(31,45,74,.08)}.toolbar input[type=search]{flex:1 1 240px;min-width:190px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit}.toolbar label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;font-weight:700}.toolbar input[type=range]{accent-color:var(--accent)}button{border:0;border-radius:9px;padding:8px 12px;background:#eaf1ff;color:#204a9a;cursor:pointer;font:inherit;font-weight:800}button:hover{filter:brightness(.96)}#all{background:var(--accent);color:#fff}#stop{background:#fee2e2;color:#a61b1b}.count{margin:12px 2px;color:var(--muted);font-size:14px}.question{margin:20px 0;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow);scroll-margin-top:90px}.question.hidden{display:none}.qhead{display:flex;gap:13px;align-items:flex-start;padding-bottom:13px;border-bottom:1px solid var(--line)}.qnum{flex:0 0 auto;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#fff4dc;color:#a65b00;font-weight:900}.qtitle{margin:0;font-size:clamp(19px,2.3vw,26px);line-height:1.3}.section{margin-top:20px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;color:#1e4b8e;font-size:17px;font-weight:850}.section-title button{padding:4px 9px;font-size:13px}.answer{padding:13px 15px;border-left:3px solid #d4e2fa;background:#f8fbff;border-radius:0 10px 10px 0}.answer p{margin:0 0 9px}.answer p:last-child{margin-bottom:0}.answer .slash{color:#b9791d;margin:0 3px}.speaking{outline:2px solid #ffcf69;background:#fff9e8}.empty{padding:30px;text-align:center;color:var(--muted)}.footer{margin-top:28px;text-align:center;color:var(--muted);font-size:13px}@media(max-width:680px){.wrap{padding:14px 10px 50px}.hero{padding:23px 20px}.toolbar{top:5px}.toolbar label{width:100%}.question{padding:17px}.qhead{gap:10px}}@media print{.toolbar{display:none}.wrap{max-width:none;padding:0}.hero{color:#111;background:#fff;border:1px solid #aaa;box-shadow:none}.question{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body><main class="wrap">
<header class="hero"><div class="eyebrow">Amazon · Data Center Operations Manager</div><h1>Complete English Answers</h1><p>完整英文回答查詢版：只顯示英文答案，方便面試前快速搜尋、複製與播放。</p></header>
<div class="toolbar"><input id="search" type="search" placeholder="搜尋題目或英文關鍵字，例如 incident、AWS、team" aria-label="搜尋英文答案"><label>速度 <input id="rate" type="range" min="0.6" max="1.3" step="0.05" value="0.9"><span id="rateValue">0.90×</span></label><button id="all" type="button">▶ 播放全部答案</button><button id="stop" type="button">■ 停止</button></div>
<div id="count" class="count"></div><section id="content"><div class="empty">正在載入英文答案…</div></section><footer class="footer">內容來源：Amazon Data Center Operations Manager Interview Workbook　·　可用上方搜尋快速定位答案</footer>
</main>
<script>
const URL='amazon-data-center-interview-star.md';let data=[];let voices=[];let queue=[];let qIndex=0;const $=s=>document.querySelector(s);const clean=s=>s.replace(/\*\*/g,'').replace(/`/g,'').trim();const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parse(md){let q=null,section=null,en=false;for(const raw of md.split(/\r?\n/)){const line=raw.trim();if(!line)continue;if(/^# \d+\./.test(line)){q={title:clean(line.replace(/^# /,'')),sections:[]};data.push(q);section=null;en=false;continue}if(!q)continue;if(/^## /.test(line)){section={title:clean(line.replace(/^## /,'')),lines:[]};q.sections.push(section);en=false;continue}if(/^\*\*English/.test(line)){en=true;continue}if(line==='---'){en=false;continue}if(/^\*\*(中文|Primary|Secondary|Leadership)/.test(line)||/^>/.test(line))continue;if(en&&section)section.lines.push(clean(line))}return data.filter(q=>q.sections.some(s=>s.lines.length))}
function render(){const root=$('#content');root.innerHTML=data.map((q,qi)=>`<article class="question" id="q${qi+1}"><div class="qhead"><div class="qnum">Q${qi+1}</div><h2 class="qtitle">${esc(q.title.replace(/^\d+\.\s*/,''))}</h2></div>${q.sections.filter(s=>s.lines.length).map((s,si)=>`<section class="section"><div class="section-title"><span>${esc(s.title)}</span><button type="button" class="section-play" data-q="${qi}" data-s="${si}">▶ 播放</button></div><div class="answer">${s.lines.map((line,li)=>`<p class="answer-line" data-q="${qi}" data-s="${si}" data-line="${li}">${esc(line).replace(/\s*\/\s*/g,' <span class="slash">/</span> ')}</p>`).join('')}</div></section>`).join('')}</article>`).join('');$('#count').textContent=`共 ${data.length} 題英文回答`}
function linesFor(qi,si){return [...document.querySelectorAll(`.answer-line[data-q="${qi}"][data-s="${si}"]`)]}function speakLines(lines){if(!('speechSynthesis'in window))return alert('此瀏覽器不支援語音播放，請改用最新版 Chrome、Edge 或 Safari。');speechSynthesis.cancel();document.querySelectorAll('.speaking').forEach(x=>x.classList.remove('speaking'));queue=lines;qIndex=0;next()}function next(){if(qIndex>=queue.length)return;const el=queue[qIndex++];const text=el.textContent.replace(/\s*\/\s*/g,', ');const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=Number($('#rate').value);const v=voices.find(x=>x.name===$('#voice')?.value);if(v)u.voice=v;el.classList.add('speaking');el.scrollIntoView({behavior:'smooth',block:'center'});u.onend=()=>{el.classList.remove('speaking');next()};u.onerror=()=>el.classList.remove('speaking');speechSynthesis.speak(u)}
function loadVoices(){if(!('speechSynthesis'in window))return;voices=speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang))}if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
$('#search').addEventListener('input',e=>{const term=e.target.value.toLowerCase().trim();let visible=0;document.querySelectorAll('.question').forEach((el,i)=>{const yes=!term||el.innerText.toLowerCase().includes(term);el.classList.toggle('hidden',!yes);if(yes)visible++});$('#count').textContent=`顯示 ${visible} / ${data.length} 題英文回答`});$('#rate').addEventListener('input',e=>$('#rateValue').textContent=Number(e.target.value).toFixed(2)+'×');$('#stop').addEventListener('click',()=>{speechSynthesis.cancel();document.querySelectorAll('.speaking').forEach(x=>x.classList.remove('speaking'));queue=[]});$('#all').addEventListener('click',()=>speakLines([...document.querySelectorAll('.answer-line')]));document.addEventListener('click',e=>{const b=e.target.closest('.section-play');if(b)speakLines(linesFor(b.dataset.q,b.dataset.s))});
fetch(URL).then(r=>{if(!r.ok)throw Error();return r.text()}).then(md=>{parse(md);render()}).catch(()=>$('#content').innerHTML='<div class="empty">無法載入英文內容，請使用 GitHub Pages 網址開啟。</div>');
</script></body></html>
