<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amazon DCOM · English Integrated Workbook</title>
<style>:root{--ink:#172033;--muted:#64748b;--line:#dbe3ef;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px 16px 60px}.hero{padding:24px 28px;border-radius:18px;background:linear-gradient(135deg,#172b4d,#2864a8);color:#fff}.hero h1{margin:4px 0 6px;font-size:clamp(25px,4vw,38px)}.hero p{margin:0;color:#e7efff}.nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.nav a{color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:8px;padding:6px 10px;text-decoration:none;font-size:13px}.toolbar{position:sticky;top:8px;z-index:3;display:flex;gap:9px;flex-wrap:wrap;margin:16px 0;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.96);box-shadow:0 7px 20px rgba(31,45,74,.08)}input{flex:1;min-width:220px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}.count{color:var(--muted);font-size:13px}.content{margin-top:12px;padding:22px 25px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 8px 24px rgba(31,45,74,.07);white-space:pre-wrap;overflow-wrap:anywhere}.content mark{background:#ffed9c;border-radius:3px;padding:1px 2px}@media(max-width:680px){.wrap{padding:12px 9px 35px}.hero{padding:20px}.content{padding:15px;font-size:15px}}
</style></head><body><main class="wrap"><header class="hero"><h1>Amazon DCOM · English Integrated Workbook</h1><p>English translation of the latest Chinese interview preparation draft, including the 14 questions, technical deep dives and operating mechanisms.</p><nav class="nav"><a href="Amazon-Data-Center-Interview-Tabs.html">Tabbed workbook</a><a href="Amazon-Data-Center-Chinese-Integrated.html">Chinese integrated draft</a><a href="index.html">Practice home</a></nav></header><div class="toolbar"><input id="search" type="search" placeholder="Search English content, questions or technical terms"><span id="count" class="count">Loading…</span></div><article id="content" class="content">Loading…</article></main><script>const source='amazon-dcom-english-integrated.md';const content=document.querySelector('#content'),search=document.querySelector('#search'),count=document.querySelector('#count');let raw='';function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(){const term=search.value.trim();if(!term){content.textContent=raw;count.textContent=raw.split(/\n/).length+' lines'}else{const lines=raw.split(/\n/);const hits=lines.filter(x=>x.toLowerCase().includes(term.toLowerCase()));content.innerHTML=hits.length?hits.map(esc).join('<br>'):'No matching content';count.textContent=hits.length+' matching lines'}}search.addEventListener('input',render);fetch(source).then(r=>r.text()).then(t=>{raw=t;render()}).catch(()=>{content.textContent='Unable to load the English integrated workbook. Please open it through GitHub Pages.';count.textContent=''})</script></body></html>
